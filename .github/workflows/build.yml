name: Build Fabric 26.3
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - uses: actions/checkout@v4
        with:
          repository: Fayberr/modern-gui
          ref: 785e5c0f7b5d95c334955af1372674a588d9a362
          path: _modern-gui
      - name: Build Modern GUI for Minecraft 26.3
        run: gradle --no-daemon -p _modern-gui publishToMavenLocal
      - name: Compile and test Comprendium
        run: gradle --no-daemon build
      - name: Verify Modern GUI bundle
        run: |
          jarfile=$(find build/libs -maxdepth 1 -name "comprendium-*.jar" ! -name "*sources*" -print -quit)
          test -n "$jarfile"
          jar tf "$jarfile" | grep "META-INF/jars/modern-gui"
      - uses: actions/upload-artifact@v4
        with:
          name: comprendium-fabric-26.3
          path: build/libs/*.jar
          if-no-files-found: error
